
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Saifi ❤️ Zaini - Love Ludo</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;padding:20px 12px;
 font-family:Arial,sans-serif;text-align:center;color:white;
 background:linear-gradient(145deg,#240038,#641477,#bd397f);
}
h1{font-size:27px;margin:12px 0}
.subtitle{color:#ffd8ef;margin-bottom:20px}
.panel{
 max-width:430px;margin:auto;padding:18px;
 background:#ffffff17;border:1px solid #ffffff45;
 border-radius:22px;box-shadow:0 8px 30px #16002066;
}
button{
 border:0;border-radius:13px;padding:13px 20px;
 margin:7px;background:#ffb5dc;color:#4b1249;
 font-size:16px;font-weight:bold;
}
input{
 width:90%;padding:14px;border-radius:12px;
 border:0;margin:10px;text-align:center;font-size:17px;
}
.players{display:flex;justify-content:space-around;margin:18px 0}
.player{padding:12px;border-radius:15px;background:#ffffff20}
.colors{display:flex;justify-content:center;gap:10px;margin:12px}
.color{width:30px;height:30px;border-radius:50%;border:3px solid white}
.red{background:#ed303b}.blue{background:#2789ff}
.green{background:#27bd70}.yellow{background:#ffdc35}
.board{
 display:grid;grid-template-columns:repeat(15,1fr);
 width:min(94vw,390px);aspect-ratio:1;
 margin:20px auto;background:white;border:4px solid white;
 border-radius:5px;overflow:hidden;gap:1px;
}
.cell{background:#f6f0f7;display:flex;align-items:center;justify-content:center}
.r{background:#ed303b}.b{background:#2789ff}
.g{background:#27bd70}.y{background:#ffdc35}
.center{background:conic-gradient(#ed303b 0 25%,#2789ff 0 50%,#ffdc35 0 75%,#27bd70 0)}
.hidden{display:none}
#status{font-weight:bold;color:#ffe0f2}
</style>
</head>
<body>
<h1>Saifi ❤️ Zaini</h1>
<div class="subtitle">💕 Our Private Love Ludo 💕</div>

<div class="panel" id="home">
<h2>Welcome to Love Ludo</h2>
<p>Sirf tum dono ke liye ❤️</p>
<button onclick="createRoom()">Create Room</button>
<br>
<input id="roomInput" placeholder="Enter Room Code">
<br>
<button onclick="joinRoom()">Join Room</button>
<p id="message"></p>
</div>

<div class="panel hidden" id="game">
<div class="players">
<div class="player">🌸 Zaini<br><span id="zColor">Red</span></div>
<div class="player">❤️ Saifi<br><span id="sColor">Blue</span></div>
</div>
<h3>Choose your colours</h3>
<div>Saifi</div>
<div class="colors">
<button class="color red" onclick="choose('saifi','Red')"></button>
<button class="color blue" onclick="choose('saifi','Blue')"></button>
<button class="color green" onclick="choose('saifi','Green')"></button>
<button class="color yellow" onclick="choose('saifi','Yellow')"></button>
</div>
<div>Zaini</div>
<div class="colors">
<button class="color red" onclick="choose('zaini','Red')"></button>
<button class="color blue" onclick="choose('zaini','Blue')"></button>
<button class="color green" onclick="choose('zaini','Green')"></button>
<button class="color yellow" onclick="choose('zaini','Yellow')"></button>
</div>
<h2>🎲 <span id="dice">1</span></h2>
<button onclick="roll()">Roll Dice 🎲</button>
<p id="status">Saifi ki baari ❤️</p>
<div class="board" id="board"></div>
<button onclick="location.reload()">Exit Game</button>
</div>

<script>
let saifi='Blue',zaini='Red',turn='Saifi';
function createRoom(){
 let code=Math.random().toString(36).substring(2,7).toUpperCase();
 document.getElementById('message').innerText='Room Code: '+code+' (share with Zaini)';
 document.getElementById('roomInput').value=code;
 startGame();
}
function joinRoom(){
 let code=document.getElementById('roomInput').value.trim();
 if(!code){document.getElementById('message').innerText='Room code likho';return}
 startGame();
}
function startGame(){
 document.getElementById('home').classList.add('hidden');
 document.getElementById('game').classList.remove('hidden');
 makeBoard();
}
function choose(player,color){
 if(player==='saifi')saifi=color;else zaini=color;
 document.getElementById('sColor').innerText=saifi;
 document.getElementById('zColor').innerText=zaini;
}
function roll(){
 let n=Math.floor(Math.random()*6)+1;
 document.getElementById('dice').innerText=n;
 turn=turn==='Saifi'?'Zaini':'Saifi';
 document.getElementById('status').innerText=turn+' ki baari ❤️';
}
function makeBoard(){
 let b=document.getElementById('board');
 for(let r=0;r<15;r++)for(let c=0;c<15;c++){
 let d=document.createElement('div');d.className='cell';
 if(r<6&&c<6)d.classList.add('r');
 if(r<6&&c>8)d.classList.add('g');
 if(r>8&&c<6)d.classList.add('b');
 if(r>8&&c>8)d.classList.add('y');
 if(r>=6&&r<=8&&c>=6&&c<=8)d.classList.add('center');
 b.appendChild(d);
 }
}
</script>
</body>
</html>
