<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Saifi ❤️ Zaini Love Ludo</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
  body {
    background: linear-gradient(135deg, #2b0540, #5e1185, #1d042b);
    color: white;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 15px;
  }
  .container { width: 100%; max-width: 420px; text-align: center; }
  .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
  .pill { background: rgba(255,255,255,0.15); padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: bold; }
  .title { font-size: 36px; font-weight: 900; text-shadow: 0 0 15px #ff2a85; margin: 10px 0 5px; }
  .subtitle { font-size: 40px; font-weight: 900; color: #ffd54f; text-shadow: 0 3px 8px #000; margin-bottom: 10px; }
  .ribbon { background: #ff2a85; display: inline-block; padding: 6px 20px; border-radius: 20px; font-size: 13px; font-weight: bold; margin-bottom: 20px; }
  .couple-circle {
    width: 130px; height: 130px; margin: 0 auto 20px; border-radius: 50%;
    border: 3px solid #ff5ca8; box-shadow: 0 0 25px #ff2a85;
    display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 45px;
  }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 18px; }
  .btn-card {
    padding: 20px 10px; border-radius: 20px; cursor: pointer; border: 2px solid rgba(255,255,255,0.5);
    box-shadow: 0 6px 20px rgba(0,0,0,0.4);
  }
  .pink { background: linear-gradient(180deg, #ff4b91, #b80d57); }
  .purple { background: linear-gradient(180deg, #9c27b0, #4a148c); }
  .features { background: rgba(0,0,0,0.35); border: 1px solid #ff80ab; border-radius: 18px; padding: 14px; font-size: 12px; }
  .feat-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; margin-top: 10px; font-size: 11px; }

  /* BOARD SCREEN */
  #board-screen { display: none; }
  .hud {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 14px; border-radius: 40px; margin: 8px 0;
  }
  .zaini { background: linear-gradient(90deg, #880e4f, #d81b60); border: 2px solid #ff80ab; }
  .saifi { background: linear-gradient(90deg, #0d47a1, #1976d2); border: 2px solid #64b5f6; }
  .dice {
    width: 48px; height: 48px; background: white; color: black; border-radius: 12px;
    font-size: 30px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-weight: bold;
  }
  .board {
    display: grid; grid-template-columns: repeat(15, 1fr); grid-template-rows: repeat(15, 1fr);
    aspect-ratio: 1/1; width: 100%; background: white; border: 4px solid #ff4081; border-radius: 12px; overflow: hidden;
  }
  .c { border: 0.5px solid #ccc; display: flex; align-items: center; justify-content: center; font-size: 10px; }
  .r { background: #e53935; } .g { background: #43a047; } .b { background: #1e88e5; } .y { background: #fdd835; }
  .dot { width: 75%; height: 75%; border-radius: 50%; border: 1.5px solid white; box-shadow: 0 2px 4px #000; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="pill" onclick="location.reload()">👑 Saifi ❤️ Zaini</div>
    <div class="pill">🔊 🎵 ⚙️</div>
  </div>

  <!-- LOBBY -->
  <div id="lobby">
    <div class="title">Saifi ❤️ Zaini</div>
    <div class="subtitle">Love Ludo</div>
    <div class="ribbon">Play Together, Stay Connected ❤️</div>

    <div class="couple-circle">
      <div>🧔🏻🧕🏻</div>
      <span style="font-size:11px; color:#ffb2d8;">Forever Together</span>
    </div>

    <div class="grid-2">
      <div class="btn-card pink" onclick="openBoard()">
        <div style="font-size:36px;">🏠</div>
        <h3>Create Room ›</h3>
        <p style="font-size:11px;">Start a new game</p>
      </div>
      <div class="btn-card purple" onclick="openBoard()">
        <div style="font-size:36px;">👥</div>
        <h3>Join Room ›</h3>
        <p style="font-size:11px;">Enter room code</p>
      </div>
    </div>

    <div class="features">
      <b>🤍 Our Love Game 🤍</b>
      <div class="feat-row">
        <div>🛡️<br>Private Game</div>
        <div>⚡<br>Real-Time</div>
        <div>❤️<br>Romantic</div>
        <div>⭐<br>Classic Rules</div>
      </div>
    </div>
  </div>

  <!-- GAME BOARD -->
  <div id="board-screen">
    <div class="hud zaini">
      <div style="display:flex; align-items:center; gap:10px;">
        <span style="font-size:30px;">🧕🏻</span>
        <div style="text-align:left;"><b>Zaini</b><br><small id="z-stat">🕒 Turn</small></div>
      </div>
      <div class="dice" id="d-zaini" onclick="roll('zaini')">⚄</div>
    </div>

    <div class="board" id="grid"></div>

    <div class="hud saifi">
      <div style="display:flex; align-items:center; gap:10px;">
        <span style="font-size:30px;">🧔🏻‍♂️</span>
        <div style="text-align:left;"><b>Saifi</b><br><small id="s-stat">🕒 Waiting...</small></div>
      </div>
      <div class="dice" id="d-saifi" onclick="roll('saifi')">⚅</div>
    </div>
  </div>
</div>

<script>
  let turn = 'zaini';
  const faces = ['⚀','⚁','⚂','⚃','⚄','⚅'];

  function openBoard() {
    document.getElementById('lobby').style.display = 'none';
    document.getElementById('board-screen').style.display = 'block';
    drawBoard();
  }

  function drawBoard() {
    const g = document.getElementById('grid');
    g.innerHTML = '';
    const tokens = {
      r: ['2,2','2,3','3,2','3,3'],
      g: ['2,11','2,12','3,11','3,12'],
      b: ['11,2','11,3','12,2','12,3'],
      y: ['11,11','11,12','12,11','12,12']
    };
    const stars = ['6,2','2,6','1,8','6,12','8,13','12,8','13,6','8,1'];

    for (let r = 0; r < 15; r++) {
      for (let c = 0; c < 15; c++) {
        const d = document.createElement('div');
        d.className = 'c';
        const pos = r + ',' + c;

        if (r < 6 && c < 6) d.className += (r>=1&&r<=4&&c>=1&&c<=4) ? '' : ' r';
        else if (r < 6 && c > 8) d.className += (r>=1&&r<=4&&c>=10&&c<=13) ? '' : ' g';
        else if (r > 8 && c < 6) d.className += (r>=10&&r<=13&&c>=1&&c<=4) ? '' : ' b';
        else if (r > 8 && c > 8) d.className += (r>=10&&r<=13&&c>=10&&c<=13) ? '' : ' y';
        else if (r >= 6 && r <= 8 && c >= 6 && c <= 8) { d.style.background = '#ff2a85'; if(r===7&&c===7) d.innerHTML='❤️'; }
        else if ((r===7 && c>=1 && c<=5) || (r===6 && c===1)) d.className += ' r';
        else if ((c===7 && r>=1 && r<=5) || (r===1 && c===8)) d.className += ' g';
        else if ((r===7 && c>=9 && c<=13) || (r===8 && c===13)) d.className += ' y';
        else if ((c===7 && r>=9 && r<=13) || (r===13 && c===6)) d.className += ' b';

        if (tokens.r.includes(pos)) d.innerHTML = '<div class="dot r"></div>';
        if (tokens.g.includes(pos)) d.innerHTML = '<div class="dot g"></div>';
        if (tokens.b.includes(pos)) d.innerHTML = '<div class="dot b"></div>';
        if (tokens.y.includes(pos)) d.innerHTML = '<div class="dot y"></div>';
        if (stars.includes(pos)) d.innerHTML = '⭐';

        g.appendChild(d);
      }
    }
  }

  function roll(p) {
    if (p !== turn) return;
    const num = Math.floor(Math.random() * 6);
    document.getElementById('d-' + p).innerText = faces[num];
    if (num !== 5) {
      turn = turn === 'zaini' ? 'saifi' : 'zaini';
      document.getElementById('z-stat').innerText = turn === 'zaini' ? '🕒 Turn' : '🕒 Waiting...';
      document.getElementById('s-stat').innerText = turn === 'saifi' ? '🕒 Turn' : '🕒 Waiting...';
    }
  }
</script>
</body>
</html>
